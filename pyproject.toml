[project]
name = "rmuc2027"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["rmuc2027-server"]
[tool.uv]
package = false
[tool.uv.workspace]
members = ["apps/server", "packages/core", "research"]
[tool.uv.sources]
rmuc2027-server = { workspace = true }
rmuc2027-research = { workspace = true }
[dependency-groups]
research = ["rmuc2027-research"]
test = ["httpx>=0.27,<1", "uvloop>=0.21; sys_platform != 'win32'"]
