[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rmuc2027-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["rmuc2027-core", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
[tool.setuptools.packages.find]
include = ["rmuc2027_server*"]
[project.scripts]
rmuc2027 = "rmuc2027_server.cli:main"
[tool.uv.sources]
rmuc2027-core = { workspace = true }
